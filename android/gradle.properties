# Memory sizing for the development laptop (15 GiB RAM, spinning disk). The Flutter
# template ships -Xmx8G, and the Kotlin daemon inherits that limit unless capped
# separately, so two 8 GB JVMs could run next to the emulator and freeze the desktop.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:MaxHeapFreeRatio=30 -XX:MinHeapFreeRatio=10 -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=192m -Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8
# Fail fast if the Kotlin daemon cannot start instead of silently compiling in-process.
kotlin.daemon.useFallbackStrategy=false

# The system locale uses a decimal comma; pin the JVM locale so build tools parse numbers correctly.
systemProp.user.language=en
systemProp.user.country=US
systemProp.file.encoding=UTF-8

# 4 physical cores and an I/O-bound disk: parallel workers slow the build down here.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.daemon=true
# Release idle daemons after 15 minutes instead of the default 3 hours.
org.gradle.daemon.idletimeout=900000
org.gradle.priority=low

# --- Flutter template lines below: keep verbatim ---
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
